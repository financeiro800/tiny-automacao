name: Rotina diária Tiny

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo (rodando manualmente). O agendamento automático sempre usa "aplicar".'
        type: choice
        options:
          - simulacao
          - diagnostico
          - aplicar
        default: simulacao

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Rodar integração
        env:
          TINY_CLIENT_ID: ${{ vars.TINY_CLIENT_ID }}
          TINY_CLIENT_SECRET: ${{ secrets.TINY_CLIENT_SECRET }}
          TINY_REFRESH_TOKEN: ${{ secrets.TINY_REFRESH_TOKEN }}
          TINY_REDIRECT_URI: ${{ vars.TINY_REDIRECT_URI }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          MODO="${{ github.event.inputs.modo || 'aplicar' }}"
          echo "Rodando em modo: $MODO"
          if [ "$MODO" = "diagnostico" ]; then
            python main.py --diagnostico
          elif [ "$MODO" = "simulacao" ]; then
            python main.py
          else
            python main.py --aplicar
          fi

      - name: Guardar relatório do dia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ github.run_id }}
          path: logs/*.json
          retention-days: 30
