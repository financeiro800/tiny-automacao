name: Autorizar Tiny (passo único)

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Cole aqui o "code" copiado da URL do webhook.site (deixe em branco na primeira execução)'
        required: false
        default: ''

jobs:
  autorizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Autorizar aplicação no Tiny
        env:
          TINY_CLIENT_ID: ${{ vars.TINY_CLIENT_ID }}
          TINY_CLIENT_SECRET: ${{ secrets.TINY_CLIENT_SECRET }}
          TINY_REDIRECT_URI: ${{ vars.TINY_REDIRECT_URI }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CODE_INPUT: ${{ github.event.inputs.code }}
        run: python autorizar_actions.py
